name: Publish ShiPing release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  release-metadata:
    name: Verify release metadata
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.96.0

      - name: Verify tag matches package versions
        shell: pwsh
        run: |
          $packageNames = @('shiping')
          $packages = @(
            (cargo metadata --locked --format-version 1 | ConvertFrom-Json).packages |
              Where-Object { $_.name -in $packageNames }
          )
          if ($packages.Count -ne $packageNames.Count) {
            $foundNames = @($packages | ForEach-Object name)
            $missingNames = @($packageNames | Where-Object { $_ -notin $foundNames })
            throw "Cargo packages were not found: $($missingNames -join ', ')"
          }

          foreach ($package in $packages) {
            $expectedTag = "v$($package.version)"
            if ($env:GITHUB_REF_NAME -ne $expectedTag) {
              throw "Release tag $env:GITHUB_REF_NAME must match $($package.name) version $expectedTag"
            }
          }

  release-build:
    name: Build ${{ matrix.name }}
    needs: release-metadata
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-latest
            kind: windows
            architecture: x86_64
            artifact_name: shiping-windows-x86_64
          # Linux packaging is retained but excluded from this GPUI release.
          - name: ShiPing macOS ARM64
            os: macos-15
            kind: macos
            architecture: arm64
            artifact_name: shiping-macos-arm64
          - name: ShiPing macOS x64
            os: macos-15-intel
            kind: macos
            architecture: x86_64
            artifact_name: shiping-macos-x86_64
    runs-on: ${{ matrix.os }}
    env:
      MACOSX_DEPLOYMENT_TARGET: '15.0'
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.96.0

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-shiping-${{ matrix.artifact_name }}

      - name: Install Linux build dependencies
        if: matrix.kind == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            libdbus-1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            libasound2-dev \
            libssl-dev \
            libx11-xcb-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libvulkan-dev \
            libclang-dev \
            libfontconfig1-dev \
            libpipewire-0.3-dev \
            libwayland-dev \
            libx11-dev \
            libxcb1-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            libxrandr-dev \
            pkg-config

      - name: Test ShiPing
        run: cargo test --locked

      - name: Build ShiPing release binary
        run: cargo build --release --locked --bin ShiPing

      - name: Build Microsoft Store upload assets
        if: matrix.kind == 'windows'
        shell: pwsh
        run: |
          $packages = (cargo metadata --locked --no-deps --format-version 1 | ConvertFrom-Json).packages
          $storeProducts = @(
            @{
              Product = 'ShiPing'
              PackageName = 'shiping'
              Executable = '.\target\release\ShiPing.exe'
            }
          )

          foreach ($storeProduct in $storeProducts) {
            $package = $packages |
              Where-Object name -eq $storeProduct.PackageName |
              Select-Object -First 1
            if ($null -eq $package) {
              throw "Cargo package $($storeProduct.PackageName) was not found."
            }
            .\tools\package-store-msix.ps1 `
              -Product $storeProduct.Product `
              -ExecutablePath $storeProduct.Executable `
              -Version $package.version `
              -OutputDirectory .\release-assets
          }

      - name: Package Windows release assets
        if: matrix.kind == 'windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path release-assets | Out-Null

          $products = @(
            @{
              Name = 'ShiPing'
              Executable = 'target\release\ShiPing.exe'
            }
          )

          foreach ($product in $products) {
            if (-not (Test-Path -LiteralPath $product.Executable -PathType Leaf)) {
              throw "Expected release executable was not produced: $($product.Executable)"
            }

            $archiveName = "$($product.Name)-$env:GITHUB_REF_NAME-windows-x86_64.zip"
            $archivePath = Join-Path 'release-assets' $archiveName
            Compress-Archive -LiteralPath $product.Executable -DestinationPath $archivePath -Force

            $hash = (Get-FileHash -LiteralPath $archivePath -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash *$archiveName" | Set-Content -LiteralPath "$archivePath.sha256" -Encoding ascii -NoNewline
          }

      - name: Package ShiPing Linux release
        if: matrix.kind == 'linux'
        shell: bash
        run: |
          bash ./tools/package-shiping-linux.sh \
            ./target/release/ShiPing \
            "$GITHUB_REF_NAME" \
            "${{ matrix.architecture }}"

      - name: Package ShiPing macOS release
        if: matrix.kind == 'macos'
        shell: bash
        run: |
          bash ./tools/package-shiping-macos.sh \
            ./target/release/ShiPing \
            "$GITHUB_REF_NAME" \
            "${{ matrix.architecture }}"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: release-assets/*
          if-no-files-found: error

  github-release:
    name: Publish GitHub Release
    needs:
      - release-build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          prerelease: false
          generate_release_notes: true
          files: release-assets/*
          fail_on_unmatched_files: true
