[package]
name = "shiping"
version = "0.2.0"
edition = "2024"
resolver = "2"
description = "ShiPing cross-platform screen recorder"
publish = false
autobins = false

[[bin]]
name = "ShiPing"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
gif = "0.14.2"
global-hotkey = "0.8"
log = { version = "0.4.33", features = ["std"] }
raw-window-handle = { version = "0.6", features = ["std"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
gpui = { package = "gpui-kit", version = "=0.7.3" }
tray-icon = { version = "=0.21.2", default-features = false }
image = { version = "0.25", default-features = false, features = ["png"] }

[target.'cfg(target_os = "windows")'.dependencies]
rfd = { version = "0.15.4", default-features = false }
windows = { version = "0.62", features = [
    "Foundation",
    "Globalization",
    "Graphics_Imaging",
    "Media_Ocr",
    "Storage_Streams",
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_Media_Audio",
    "Win32_Media_KernelStreaming",
    "Win32_Media_MediaFoundation",
    "Win32_Media_Multimedia",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_DataExchange",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Memory",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
    "Win32_System_WinRT",
    "Win32_System_Variant",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(target_os = "macos")'.dependencies]
# apple-metal 0.8.x uses macOS 26 Metal symbols even when targeting macOS 15.
apple-metal = { version = "=0.6.0", default-features = false }
block2 = "0.6.2"
objc2 = "0.6.4"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSView", "NSWindow", "NSResponder"] }
objc2-av-foundation = { version = "0.3.2", default-features = false, features = [
    "std",
    "AVAssetWriter",
    "AVAssetWriterInput",
    "AVMediaFormat",
    "AVVideoSettings",
    "block2",
    "objc2-core-media",
    "objc2-core-video",
] }
objc2-avf-audio = { version = "0.3.2", default-features = false, features = [
    "std",
    "AVAudioSettings",
] }
objc2-core-audio-types = { version = "0.3.2", default-features = false, features = [
    "std",
    "CoreAudioBaseTypes",
] }
objc2-core-foundation = { version = "0.3.2", default-features = false, features = [
    "std",
    "CFBase",
    "CFDictionary",
    "CFString",
] }
objc2-core-media = { version = "0.3.2", default-features = false, features = [
    "std",
    "CMBase",
    "CMBlockBuffer",
    "CMFormatDescription",
    "CMSampleBuffer",
    "CMTime",
    "objc2",
    "objc2-core-audio-types",
] }
objc2-core-video = { version = "0.3.2", default-features = false, features = [
    "std",
    "CVBase",
    "CVBuffer",
    "CVImageBuffer",
    "CVPixelBuffer",
    "CVPixelBufferPool",
    "CVReturn",
    "objc2",
] }
objc2-foundation = { version = "0.3.2", default-features = false, features = [
    "std",
    "NSDictionary",
    "NSError",
    "NSObject",
    "NSString",
    "NSURL",
    "NSValue",
    "objc2-core-foundation",
] }
rfd = { version = "0.15.4", default-features = false }
screencapturekit = { version = "8.0.1", features = ["macos_15_0"] }

[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"
ashpd = { version = "0.13.13", default-features = false, features = ["tokio", "screencast"] }
pipewire = "0.9.2"
rfd = { version = "0.15.4", default-features = false, features = ["tokio", "xdg-portal"] }
tokio = { version = "1.49", features = ["net", "rt", "time"] }

[target.'cfg(target_os = "windows")'.build-dependencies]
winresource = "0.1.31"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
